name: Garden Path material integrity (no inference)
on:
  push:
    paths:
      - "research/tools/**"
      - "research/tests/**"
      - "data/gp_behavior/candidates/**"
      - "data/gp_behavior/upstream/amouyal/**"
      - ".github/workflows/gp-material-integrity.yml"
  pull_request:
    paths:
      - "research/tools/**"
      - "research/tests/**"
      - ".github/workflows/gp-material-integrity.yml"
  workflow_dispatch:
jobs:
  offline-unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate offline-only source and schema unit tests
        run: python -m unittest discover -s research/tests -p "test_*.py" -v
      - name: Check source blob hashes and generated candidate identity
        run: python research/tools/verify_upstream_candidates.py
